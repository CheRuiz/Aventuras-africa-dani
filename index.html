<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Las Aventuras de África y Daniel</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#68c9f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#menu,#win{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(#57c8f7,#d9f8ff);padding:18px;box-sizing:border-box}
#win{display:none}
.panel{width:min(560px,94vw);background:white;border-radius:26px;padding:22px;box-sizing:border-box;text-align:center;box-shadow:0 10px 35px rgba(0,0,0,.18)}
h1{margin:0 0 8px;color:#ef4c91;font-size:clamp(27px,7vw,48px);line-height:1.05}
h2{margin:8px;color:#18577b}
p{color:#385d70}
.chars{display:flex;gap:12px;justify-content:center;margin:14px 0}
.char{width:44%;padding:8px;border:4px solid transparent;border-radius:18px;background:#f2f7fa}
.char.selected{border-color:#ef4c91}
.char img{width:100px;height:100px;object-fit:cover;border-radius:14px}
.char b{display:block;font-size:19px;color:#18577b;margin-top:4px}
button{border:0;border-radius:16px;padding:13px 22px;font-size:19px;font-weight:900;background:#ffd34e;color:#513700;box-shadow:0 4px 0 #b77b0a}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #b77b0a}
#hud{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;color:#fff;font-weight:900;font-size:19px;text-shadow:2px 2px 3px #24506c;pointer-events:none}
#help{position:fixed;z-index:5;left:50%;bottom:calc(105px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(255,255,255,.92);color:#21435a;padding:8px 13px;border-radius:18px;font-weight:800;font-size:13px;pointer-events:none;white-space:nowrap}
#moveStatus{position:fixed;z-index:21;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(255,255,255,.82);color:#173b57;padding:5px 12px;border-radius:14px;font-weight:900;font-size:12px;pointer-events:none}#controls{position:fixed;z-index:20;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:none;justify-content:space-between;align-items:end;padding:0 16px;pointer-events:none}
.ctrl{width:74px;height:62px;border-radius:18px;background:rgba(255,255,255,.9);color:#173b57;font-size:30px;box-shadow:0 4px 0 #8aa0ad;display:flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#rightWrap{display:flex;gap:12px}
.small{font-size:13px;color:#668391}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud"><span id="stats">⭐ 0/3 · 🪙 0 · ❤️ 3</span><span id="heroName">ÁFRICA</span></div>
<div id="help">◀ ▶ para correr · ↑ para saltar</div>
<div id="moveStatus">LISTO</div>
<div id="controls">
  <div class="ctrl" id="leftBtn">◀</div>
  <div id="rightWrap"><div class="ctrl" id="rightBtn">▶</div><div class="ctrl" id="jumpBtn">↑</div></div>
</div>

<div id="menu">
  <div class="panel">
    <h1>Las Aventuras de<br>África y Daniel</h1>
    <h2>🌳 Mundo 1 · Nivel 1</h2>
    <p><b>La Pradera de los Saltitos</b></p>
    <div class="chars">
      <div class="char selected" id="africaPick"><img src="africa.jpg"><b>África</b></div>
      <div class="char" id="danielPick"><img src="daniel.jpg"><b>Daniel</b></div>
    </div>
    <button id="playBtn">▶ JUGAR</button>
    <p class="small">Consigue las 3 estrellas y llega al castillo.</p>
  </div>
</div>

<div id="win">
  <div class="panel">
    <h1>🎉 ¡Nivel completado!</h1>
    <h2 id="winText"></h2>
    <button id="againBtn">🔄 JUGAR OTRA VEZ</button>
  </div>
</div>

<script>
(function(){
"use strict";

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");
var W=0,H=0,dpr=1;
var selected="africa", running=false, lastTime=0, camera=0;
var keys={left:false,right:false,jump:false};
var moveStatus=document.getElementById("moveStatus");
var hero={x:80,y:0,w:62,h:78,vx:0,vy:0,onGround:false,lives:3,score:0};
var levelWidth=5200;
var hearts=[];

var platforms=[
 [0,520,850,90],[930,470,450,90],[1450,520,700,90],[2250,460,430,90],
 [2800,520,700,90],[3650,450,600,90],[4400,520,800,90],
 [420,410,160,25],[690,350,170,25],[1040,360,170,25],[1250,300,130,25],
 [1660,390,170,25],[1940,320,160,25],[2350,350,170,25],[3050,370,180,25],
 [3380,300,160,25],[3820,330,160,25],[4150,290,180,25]
];

var stars=[
 {x:720,y:305,got:false},{x:1270,y:255,got:false},{x:3950,y:285,got:false}
];
var coins=[];
for(var i=0;i<30;i++) coins.push({x:220+i*165+(i%3)*20,y:445-(i%4)*25,got:false});

var enemies=[
 {x:610,y:475,w:48,h:45,vx:1,alive:true,type:"papa"},{x:1120,y:425,w:48,h:45,vx:-1,alive:true,type:"mama"},
 {x:1760,y:475,w:48,h:45,vx:1.2,alive:true,type:"papa"},{x:2930,y:475,w:48,h:45,vx:-1.2,alive:true,type:"mama"},
 {x:3720,y:405,w:48,h:45,vx:1.2,alive:true,type:"papa"},{x:4480,y:475,w:48,h:45,vx:-1.2,alive:true,type:"mama"}
];

var imgs={africa:new Image(),daniel:new Image()};
imgs.africa.src="africa.jpg";
imgs.daniel.src="daniel.jpg";

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr);
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",resize);
resize();

function reset(){
  hero.x=80; hero.y=350; hero.vx=0; hero.vy=0; hero.onGround=false; hero.lives=3; hero.score=0;
  camera=0;
  for(var i=0;i<stars.length;i++) stars[i].got=false;
  for(var j=0;j<coins.length;j++) coins[j].got=false;
  var ex=[610,1120,1760,2930,3720,4480];
  var sp=[1,-1,1.2,-1.2,1.2,-1.2];
  for(var k=0;k<enemies.length;k++){enemies[k].x=ex[k];enemies[k].vx=sp[k];enemies[k].alive=true;}
  updateHud();
}

function isPressed(name){
  return keys[name];
}

function jump(){
  if(hero.onGround){ hero.vy=-15; hero.onGround=false; }
}

function hit(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}

function hurt(){
  hero.lives--;
  if(hero.lives<=0){ reset(); return; }
  hero.x=Math.max(60,hero.x-180); hero.y=300; hero.vx=0; hero.vy=0;
}

function update(dt){
  if(!running) return;
  if(moveStatus) moveStatus.textContent=keys.left?"◀ IZQUIERDA":(keys.right?"DERECHA ▶":"LISTO");

  var left=isPressed("left"), right=isPressed("right");
  hero.vx += (right?0.7:0) - (left?0.7:0);
  hero.vx *= 0.86;
  if(hero.vx>7) hero.vx=7;
  if(hero.vx<-7) hero.vx=-7;

  hero.vy += 0.72;
  var oldY=hero.y;
  hero.x += hero.vx;
  hero.y += hero.vy;
  hero.onGround=false;

  for(var i=0;i<platforms.length;i++){
    var q=platforms[i];
    if(hero.x+hero.w>q[0] && hero.x<q[0]+q[2] &&
       oldY+hero.h<=q[1] && hero.y+hero.h>=q[1] && hero.vy>=0){
      hero.y=q[1]-hero.h; hero.vy=0; hero.onGround=true;
    }
  }

  if(hero.x<0) hero.x=0;
  if(hero.y>H+120){ hurt(); }

  for(var c=0;c<coins.length;c++){
    if(!coins[c].got && Math.hypot(hero.x+hero.w/2-coins[c].x,hero.y+hero.h/2-coins[c].y)<45){
      coins[c].got=true; hero.score+=50;
    }
  }
  for(var s=0;s<stars.length;s++){
    if(!stars[s].got && Math.hypot(hero.x+hero.w/2-stars[s].x,hero.y+hero.h/2-stars[s].y)<52){
      stars[s].got=true; hero.score+=500;
    }
  }

  for(var e=0;e<enemies.length;e++){
    var en=enemies[e]; if(!en.alive) continue;
    en.x+=en.vx;
    if(en.x<50 || en.x>levelWidth-100) en.vx*=-1;
    if(hit(hero,en)){
      if(hero.vy>2 && hero.y+hero.h<en.y+25){
        en.alive=false; hero.vy=-10; hero.score+=100;
      }else{
        hurt();
      }
    }
  }

  camera += (hero.x-W*0.35-camera)*0.12;
  if(camera<0) camera=0;
  if(camera>levelWidth-W) camera=Math.max(0,levelWidth-W);

  updateHud();

  if(hero.x>5000 && stars.every(function(s){return s.got;})){
    running=false;
    document.getElementById("winText").textContent="⭐ 3/3 · 🪙 "+coins.filter(function(c){return c.got;}).length+" · "+hero.score+" puntos";
    document.getElementById("win").style.display="flex";
    document.getElementById("controls").style.display="none";
  }
}

function updateHud(){
  var gotStars=stars.filter(function(s){return s.got;}).length;
  var gotCoins=coins.filter(function(c){return c.got;}).length;
  document.getElementById("stats").textContent="⭐ "+gotStars+"/3 · 🪙 "+gotCoins+" · ❤️ "+hero.lives;
  document.getElementById("heroName").textContent=selected==="africa"?"ÁFRICA":"DANIEL";
}

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  var grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#55c9fa"); grad.addColorStop(1,"#d7f7ff");
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(-camera,0);

  // hills
  for(var x=-200;x<levelWidth+400;x+=500){
    ctx.fillStyle="#98dda0";
    ctx.beginPath(); ctx.arc(x+250,500,220,Math.PI,0); ctx.fill();
  }

  // clouds
  for(var cl=100;cl<levelWidth;cl+=720){
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.arc(cl,120,35,0,Math.PI*2); ctx.arc(cl+45,115,48,0,Math.PI*2); ctx.arc(cl+90,125,30,0,Math.PI*2); ctx.fill();
  }

  // ground/platforms
  for(var pidx=0;pidx<platforms.length;pidx++){
    var p=platforms[pidx];
    ctx.fillStyle="#78c850"; ctx.fillRect(p[0],p[1],p[2],p[3]);
    ctx.fillStyle="#9a5b33"; ctx.fillRect(p[0],p[1]+p[3]-18,p[2],18);
  }

  // coins
  for(var ci=0;ci<coins.length;ci++) if(!coins[ci].got){
    ctx.fillStyle="#ffd43b"; ctx.beginPath(); ctx.arc(coins[ci].x,coins[ci].y,12,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#fff3a5"; ctx.fillRect(coins[ci].x-3,coins[ci].y-7,4,14);
  }

  // stars
  for(var si=0;si<stars.length;si++) if(!stars[si].got) drawStar(stars[si].x,stars[si].y,18);

  // enemies
  for(var ei=0;ei<enemies.length;ei++) if(enemies[ei].alive){
    var en=enemies[ei];
    ctx.fillStyle="#765238"; ctx.beginPath(); ctx.arc(en.x+24,en.y+25,24,Math.PI,0); ctx.fill();
    ctx.fillStyle="#fff"; ctx.fillRect(en.x+10,en.y+20,7,7); ctx.fillRect(en.x+31,en.y+20,7,7);
  }

  // castle
  ctx.fillStyle="#d8a05d"; ctx.fillRect(5050,380,120,140);
  ctx.fillStyle="#b43d6b"; ctx.beginPath(); ctx.moveTo(5035,380); ctx.lineTo(5110,315); ctx.lineTo(5185,380); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#fff"; ctx.fillRect(5095,450,30,70);

  // hero
  var im=imgs[selected];
  ctx.save();
  ctx.beginPath();
  ctx.arc(hero.x+hero.w/2,hero.y+hero.w/2,hero.w/2,0,Math.PI*2);
  ctx.clip();
  if(im.complete && im.naturalWidth>0) ctx.drawImage(im,hero.x,hero.y,hero.w,hero.h);
  else { ctx.fillStyle=selected==="africa"?"#ef4c91":"#7aa6d8"; ctx.fillRect(hero.x,hero.y,hero.w,hero.h); }
  ctx.restore();
  ctx.strokeStyle="#fff"; ctx.lineWidth=4; ctx.strokeRect(hero.x,hero.y,hero.w,hero.h);

  ctx.restore();
}

function drawStar(x,y,r){
  ctx.fillStyle="#ffd43b"; ctx.beginPath();
  for(var i=0;i<10;i++){
    var a=-Math.PI/2+i*Math.PI/5;
    var rr=(i%2===0)?r:r*0.42;
    if(i===0) ctx.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);
    else ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);
  }
  ctx.closePath(); ctx.fill();
}

function frame(t){
  if(!lastTime) lastTime=t;
  lastTime=t;
  update(1);
  draw();
  requestAnimationFrame(frame);
}

function bindHold(id,name){
  var el=document.getElementById(id);
  function on(e){e.preventDefault();keys[name]=true;}
  function off(e){e.preventDefault();keys[name]=false;}
  el.addEventListener("touchstart",on,{passive:false});
  el.addEventListener("touchend",off,{passive:false});
  el.addEventListener("touchcancel",off,{passive:false});
  el.addEventListener("pointerdown",on);
  el.addEventListener("pointerup",off);
  el.addEventListener("pointercancel",off);
}
bindHold("leftBtn","left");
bindHold("rightBtn","right");

function bindJump(){
  var el=document.getElementById("jumpBtn");
  function go(e){e.preventDefault();jump();}
  el.addEventListener("touchstart",go,{passive:false});
  el.addEventListener("pointerdown",go);
}
bindJump();

document.getElementById("africaPick").onclick=function(){
  selected="africa";
  document.getElementById("africaPick").classList.add("selected");
  document.getElementById("danielPick").classList.remove("selected");
  updateHud();
};
document.getElementById("danielPick").onclick=function(){
  selected="daniel";
  document.getElementById("danielPick").classList.add("selected");
  document.getElementById("africaPick").classList.remove("selected");
  updateHud();
};
document.getElementById("playBtn").onclick=function(){
  keys.left=false; keys.right=false; keys.jump=false;
  document.getElementById("menu").style.display="none";
  document.getElementById("controls").style.display="flex";
  running=true;
  reset();
};
document.getElementById("againBtn").onclick=function(){
  document.getElementById("win").style.display="none";
  document.getElementById("controls").style.display="flex";
  running=true;
  reset();
};

window.addEventListener("keydown",function(e){
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a") keys.left=true;
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d") keys.right=true;
  if(e.key==="ArrowUp"||e.key===" "||e.key.toLowerCase()==="w"){e.preventDefault();jump();}
});
window.addEventListener("keyup",function(e){
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a") keys.left=false;
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d") keys.right=false;
});

reset();
updateHud();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
